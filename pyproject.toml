[project]
name = "stella"
version = "0.1.1"
description = "STELLA — Synthetic Tracking Engine for Locating & Logging Asteroids"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "astropy>=6.0",
    "numpy>=1.26",
    "photutils>=1.13",
    "scipy>=1.13",
    "torch>=2.2",
    "astroquery>=0.4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
packaging = [
    "pyinstaller>=6.0",
    # Build-Abhängigkeit, nicht von STELLA selbst genutzt: photutils importiert
    # astropy.visualization, das matplotlib-gestützt ist. PyInstaller importiert beim
    # Analysieren jedes gesammelte Paket — ohne matplotlib bricht der Build dort ab.
    "matplotlib>=3.8",
]

[build-system]
# setuptools>=77 wegen der SPDX-Lizenzangabe oben (PEP 639); ältere Versionen kennen
# `license = "MIT"` als Zeichenkette nicht und brechen beim Erzeugen der Metadaten ab.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
