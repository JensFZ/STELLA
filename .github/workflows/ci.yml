name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only Torch-Wheels: der CI-Runner hat keine GPU, die Standard-PyPI-Wheels
          # bundeln aber CUDA-Runtime-Bibliotheken und sind um ein Vielfaches größer.
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
          pytest
