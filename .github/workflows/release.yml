name: Release

# Baut das Windows-Bundle und veröffentlicht es als Release-Asset.
#
# Ausgelöst durch einen Versions-Tag (`git tag v0.1.0 && git push origin v0.1.0`).
# `workflow_dispatch` baut dasselbe, veröffentlicht aber nichts, sondern legt das Paket
# als Workflow-Artefakt ab — damit lässt sich der Ablauf prüfen, ohne einen Tag zu
# verbrennen.
#
# Nicht Teil von ci.yml: der Build lädt PyTorch und Qt herunter und braucht Größenordnung
# 20 Minuten. Das bei jedem Push zu bezahlen wäre unverhältnismäßig, zumal ein Bruch fast
# immer aus stella.spec kommt und nicht aus dem Anwendungscode.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only Torch: die CUDA-Wheels bringen mehrere GB Laufzeitbibliotheken mit und
          # sprengten das Release-Asset. Wer GPU-Beschleunigung braucht, baut selbst — siehe
          # BUILD.md.
          pip install -e ".[dev,packaging]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Version aus pyproject lesen
        id: version
        shell: pwsh
        run: |
          # Binaer oeffnen, nicht read_text(): TOML ist laut Spezifikation UTF-8, waehrend
          # Python auf Windows im Textmodus die ANSI-Codepage nimmt. pyproject.toml
          # enthaelt Umlaute in den Kommentaren.
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Projektversion: $version"

      - name: Tag gegen Projektversion prüfen
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # Sonst trägt das Release eine andere Nummer als die Anwendung über sich selbst
          # meldet — ein Fehler, der erst beim Nutzer auffällt.
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($tag -ne "${{ steps.version.outputs.version }}") {
            Write-Output "FEHLER: Tag v$tag passt nicht zu project.version = ${{ steps.version.outputs.version }} in pyproject.toml."
            exit 1
          }
          Write-Output "OK: Tag und Projektversion stimmen überein ($tag)."

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Übersetzungen kompilieren
        shell: pwsh
        run: |
          # Die .qm liegt zwar im Repo, könnte aber gegenüber der .ts veraltet sein. Neu
          # erzeugen kostet Sekunden und schließt aus, dass ein Release mit veralteten
          # Texten ausgeliefert wird.
          pyside6-lrelease i18n\stella_en.ts -qm i18n\stella_en.qm

      - name: Bundle bauen (PyInstaller)
        run: pyinstaller stella.spec --noconfirm --clean

      - name: Smoke-Test
        shell: pwsh
        run: .\scripts\smoke_test_build.ps1 -Headless

      - name: Paket schnüren
        id: package
        shell: pwsh
        run: |
          $name = "STELLA-${{ steps.version.outputs.version }}-windows-x64"
          # 7-Zip statt Compress-Archive: bei rund 700 MB ist das Cmdlet um ein Vielfaches
          # langsamer. 7z ist auf den Windows-Runnern vorinstalliert.
          # Ohne \* am Ende: das Archiv enthaelt den Ordner STELLA\, nicht dessen Inhalt
          # lose im Wurzelverzeichnis. Beim Entpacken entsteht so ein sauberer Ordner --
          # und der muss ohnehin zusammenbleiben.
          7z a -tzip "$name.zip" .\dist\STELLA | Select-Object -Last 3
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
          "name=$name" >> $env:GITHUB_OUTPUT
          $mb = (Get-Item "$name.zip").Length / 1MB
          Write-Output ("Asset: $name.zip ({0:N0} MB)" -f $mb)

      - name: Als Artefakt ablegen (Probelauf ohne Tag)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip
          retention-days: 7

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Der feste Textteil steht in .github/release-notes.md, nicht hier: ein
          # PowerShell-Here-String verlangt seinen Inhalt ab Spalte 0 und fiele damit aus
          # dem eingerückten YAML-Block heraus. --generate-notes hängt die Liste der
          # Commits seit dem letzten Tag an.
          gh release create "${{ github.ref_name }}" `
            "${{ steps.package.outputs.name }}.zip" `
            "${{ steps.package.outputs.name }}.zip.sha256" `
            --title "STELLA ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md `
            --generate-notes
